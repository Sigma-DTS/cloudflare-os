name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: "24.19.0"

jobs:
  scope:
    name: Determine validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native-only: ${{ steps.paths.outputs.native_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: paths
        name: Route actual changed paths and assert negative boundaries
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const nativeOnly = paths => paths.length > 0 && paths.every(path =>
            /^packages\/(gatekeeper-github|mcp-shared)\/.+/.test(path));
          assert.equal(nativeOnly(['packages/gatekeeper-github/src/github.ts']), true);
          assert.equal(nativeOnly(['packages/mcp-shared/src/facet.ts', 'packages/gatekeeper-github/src/types.d.ts']), true);
          assert.equal(nativeOnly([]), false);
          for (const outside of ['packages/workshop-backend/src/git-cache.ts', 'packages/workshop-shared/src/gatekeeper.ts',
            'packages/gatekeeper-kit/src/index.ts', 'packages/gatekeeper-mcp/src/mcp.ts', 'packages/gatekeeper-mcp-portal/src/portal.ts',
            'packages/workshop-frontend/src/app.tsx', 'pnpm-lock.yaml', 'package.json', '.github/workflows/ci.yml',
            'scripts/release/build-release.ts', 'packages/gatekeeper-github-other/src/index.ts']) {
            assert.equal(nativeOnly([outside]), false);
            assert.equal(nativeOnly(['packages/mcp-shared/src/facet.ts', outside]), false);
          }
          let selected = false;
          const { EVENT, BASE, HEAD, GITHUB_OUTPUT } = process.env;
          if (EVENT === 'pull_request' && /^[a-f0-9]{40}$/.test(BASE ?? '') && /^[a-f0-9]{40}$/.test(HEAD ?? '')) {
            try {
              const paths = execFileSync('git', ['diff', '--name-only', '-z', BASE, HEAD, '--'], { encoding: 'utf8' })
                .split('\0').filter(Boolean);
              selected = nativeOnly(paths);
              console.log(JSON.stringify({ base: BASE, head: HEAD, paths, nativeOnly: selected }));
            } catch (error) {
              console.error('Changed paths could not be verified; full validation is required.');
            }
          }
          appendFileSync(GITHUB_OUTPUT, `native_only=${selected}\n`);
          NODE

  native-delivery:
    name: Native delivery producers
    needs: scope
    if: needs.scope.outputs.native-only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Enable Corepack
        run: corepack enable
      - name: Set up Vite+ and Node.js
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false
          run-install: false
      - name: Install only affected producers and native consumer dependencies
        run: >-
          pnpm install --frozen-lockfile --ignore-scripts
          --filter @gadgets/github-gatekeeper...
          --filter @gadgets/typed-storage...
          --filter @gadgets/mcp-shared...
          --filter @gadgets/mcp-gatekeeper...
          --filter @gadgets/mcp-portal-gatekeeper...
      - name: Prepare scoped native prerequisites
        run: |
          pnpm --filter @gadgets/typed-storage exec tsc
          pnpm --filter @gadgets/github-gatekeeper exec gadgets-build-configurator .
      - name: Typecheck and lint affected contracts and consumers
        run: |
          pnpm --filter @gadgets/github-gatekeeper exec tsc --noEmit
          pnpm --filter @gadgets/github-gatekeeper exec tsc -p tsconfig.contract.json
          pnpm --filter @gadgets/mcp-shared build
          pnpm --filter @gadgets/mcp-gatekeeper exec tsc --noEmit
          pnpm --filter @gadgets/mcp-portal-gatekeeper exec tsc --noEmit
          pnpm exec vp lint packages/gatekeeper-github packages/mcp-shared packages/gatekeeper-mcp packages/gatekeeper-mcp-portal
      - name: Exercise original native actions with fake I/O
        run: |
          pnpm --filter @gadgets/github-gatekeeper exec vitest run
          pnpm --filter @gadgets/github-gatekeeper exec vitest run -c vitest.worker.config.ts
          pnpm --filter @gadgets/mcp-shared exec vitest run
          pnpm --filter @gadgets/mcp-gatekeeper exec vitest run
          pnpm --filter @gadgets/mcp-portal-gatekeeper exec vitest run
      - name: Generate concrete producer RPC validators outside test roots
        run: |
          pnpm --filter @gadgets/github-gatekeeper exec capnweb-validate build --out "$RUNNER_TEMP/native-delivery/github"
          pnpm --filter @gadgets/mcp-gatekeeper exec capnweb-validate build --out "$RUNNER_TEMP/native-delivery/mcp"
          pnpm --filter @gadgets/mcp-portal-gatekeeper exec capnweb-validate build --out "$RUNNER_TEMP/native-delivery/mcp-portal"

  # Parallel to `test` so lint, type and test failures surface on the same run. The package type
  # check (`pnpm build`) runs here rather than ahead of the tests, which do not need it: each test
  # task declares the codegen it reads. `scripts/` has its own type check, kept off `pnpm build`'s
  # hot path (see docs/build-system.md).
  lint:
    needs: scope
    if: needs.scope.outputs.native-only != 'true'
    name: Lint
    runs-on: ubuntu-latest
    # A wedged build would otherwise burn the 6-hour default, as `test` notes below.
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ downloads its own pnpm for `vp install` and exposes no shim, so this is what puts
      # `pnpm` on PATH for the steps below.
      - name: Enable Corepack
        run: corepack enable

      # Vite+ resolves its own version from the `vite-plus` catalog entry, and installs the pnpm
      # named in `packageManager` (integrity hash checked as Corepack does), so setup-node is not
      # needed.
      #
      # No dependency cache in this workflow: restoring setup-vp's (~540 MB) takes longer than
      # letting `vp install` download the packages (setup p50 29 s cached, 20 s uncached).
      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false
          run-install: true

      - name: Lint
        run: pnpm lint:check

      - name: Type-check scripts/
        run: pnpm types:scripts

      - name: Check generated worker configs
        run: pnpm configs:check

      # Codegen, the frontend/SPA bundles, and the repo's single type check (`types:check` aliases
      # this). It runs even when a step above failed, so a lint error does not hide a type error.
      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

  # The three slowest test tasks each get a runner, and every other package shares one. Each leg runs
  # the root `test` script's command (package.json) with its own filters; keep the two in step.
  test:
    needs: scope
    if: needs.scope.outputs.native-only != 'true'
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    # Without an explicit cap a wedged test process (a spawned child that outlives its reap keeps
    # `node --test` alive forever) burns the 6-hour default instead of failing, on every run of the
    # branch.
    timeout-minutes: 20
    strategy:
      # Let every leg finish, so one run reports every failing package.
      fail-fast: false
      # scripts/vp/concurrency.ts gives each suite 2 vitest workers, because it assumes 4 suites
      # share the 4 cores. A leg that tests one package runs one suite at a time, so it uses 3.
      # Measured in pairs on the same runner, 3 workers were faster in 8 of 9 pairs across the three
      # packages, by 22-26 s for the backend, which sets the run's pace.
      matrix:
        include:
          - name: workshop-backend
            filters: --filter=@gadgets/workshop-backend
            vitest-workers: 3
          - name: workshop-frontend
            filters: --filter=@gadgets/workshop-frontend
            vitest-workers: 3
            chromium: true
          - name: integration-tests
            filters: --filter=@gadgets/integration-tests
            vitest-workers: 3
          # Must exclude every package named above, or its tests run twice.
          - name: other packages
            filters: >-
              --filter=!cloudflare-os
              --filter=!@gadgets/workshop-backend
              --filter=!@gadgets/workshop-frontend
              --filter=!@gadgets/integration-tests
            # configurator-ui's browser suite and generated-frame test.
            chromium: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Vite+ downloads its own pnpm for `vp install` and exposes no shim, so this is what puts
      # `pnpm` on PATH for the steps below.
      - name: Enable Corepack
        run: corepack enable

      # Vite+ resolves its own version from the `vite-plus` catalog entry, and installs the pnpm
      # named in `packageManager` (integrity hash checked as Corepack does), so setup-node is not
      # needed. No dependency cache, as `lint` explains.
      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false
          run-install: true

      # The frontend's and configurator-ui's browser suites (`vitest.browser.config.ts`), and
      # configurator-ui's generated-frame test, run in Chromium, which Playwright downloads outside
      # node_modules; both packages pin the catalog `playwright`, so one install serves them.
      # `--with-deps` adds the system libraries it needs.
      - name: Install Chromium for the browser suite
        if: ${{ matrix.chromium }}
        run: pnpm --filter @gadgets/workshop-frontend exec playwright install --with-deps chromium

      # `vp run` exits 0 when a filter matches no package, so a renamed package would pass its leg
      # having run nothing. `--fail-if-no-match` makes that an error.
      # Sets `VITEST_MAX_WORKERS` only when the leg asks: an empty value would count as explicit
      # and leave every suite at vitest's own default.
      - name: Test
        env:
          FILTERS: ${{ matrix.filters }}
          VITEST_WORKERS: ${{ matrix.vitest-workers }}
        run: |
          [ -z "$VITEST_WORKERS" ] || export VITEST_MAX_WORKERS="$VITEST_WORKERS"
          node scripts/vp/run.ts --cache --fail-if-no-match $FILTERS test

  # main's ruleset requires a check with exactly this name: renaming the job blocks every merge. It
  # passes only if every `test` leg passed. `always()` because a skipped required check counts as
  # passed, and without it a failed or cancelled leg would skip this job.
  build-and-test:
    name: Build and test
    needs: [scope, test, native-delivery]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every test leg to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          NATIVE_ONLY: ${{ needs.scope.outputs.native-only }}
          NATIVE_RESULT: ${{ needs.native-delivery.result }}
          FULL_RESULT: ${{ needs.test.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$NATIVE_ONLY" = true ]; then
            test "$NATIVE_RESULT" = success
          else
            test "$FULL_RESULT" = success
          fi
