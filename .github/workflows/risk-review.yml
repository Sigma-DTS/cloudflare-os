name: Risk review

# Classifies each pull request as low or high risk and posts the `risk-review` commit status on its
# head, which passes once that tier's human approvals of the head commit are in (0 or 1). The rules
# and the reasons behind them are in scripts/risk-review.ts.
#
# Both triggers run this file and the script from the base branch, never the pull request's copy,
# so a change cannot rewrite its own classifier. Nothing checks out the pull request's code: the
# diff is read through the API and only sent to Clef. Review events arrive through
# risk-review-trigger.yml, because `pull_request_review` runs the pull request's own copy of the
# workflow, with a read-only token when the head is in a fork.
#
# A maintainer's pull request (write access or above, the same check as Bonk's break-glass) is
# classified straight away. Anyone else's waits in the `risk-review-external` environment until a
# maintainer approves the run, and until then has no status, so it cannot merge.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, assigned, unassigned]
  workflow_run:
    workflows: [Risk review trigger]
    types: [completed]

permissions: {}

jobs:
  # Reads only the GitHub API, with no secrets, so it is safe to run for anyone.
  authorize:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      author: ${{ steps.authorize.outputs.author }}
    steps:
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Check the author's permission
        id: authorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = await import("node:url");
            const scriptUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/risk-review.ts`);
            const { authorizeRiskReview } = await import(scriptUrl.href);
            await authorizeRiskReview({ github, context, core });

  # `maintainer` and `external` are the same job; only `external` waits for an approval.
  maintainer:
    needs: authorize
    if: needs.authorize.outputs.author == 'maintainer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One evaluation per head commit at a time: each reads live reviews, so the last to finish
    # must also be the last to start.
    concurrency:
      group: risk-review-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps: &classify
      - name: Check out trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Classify and post status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Needs Workers AI Read on the account. Without it every pull request is high risk,
          # which fails safe but makes the low tier unreachable.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AI_GATEWAY_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CF_AI_GATEWAY_NAME }}
        with:
          script: |
            const { pathToFileURL } = await import("node:url");
            const scriptUrl = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/risk-review.ts`);
            const { runRiskReview } = await import(scriptUrl.href);
            await runRiskReview({
              github,
              context,
              core,
              clef: {
                accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
                apiToken: process.env.CLOUDFLARE_API_TOKEN,
                gatewayId: process.env.CLOUDFLARE_GATEWAY_ID,
              },
            });

  external:
    needs: authorize
    if: needs.authorize.outputs.author == 'other'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Required reviewers on this environment are what hold the run for a maintainer.
    environment: risk-review-external
    concurrency:
      group: risk-review-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps: *classify
